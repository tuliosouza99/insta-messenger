<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Messenger</title>
  <link rel="stylesheet" href="error.css">
  <script src="error.js" defer></script>
</head>
<body>
  <div class="brand">Instagram <span>Messenger</span></div>
  <main>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M39 22.5c0 9-6.7 15.5-16 15.5-2.5 0-4.8-.5-6.8-1.4L8 40l2.7-8.4C8.9 29 8 26 8 22.5 8 13.5 14.7 7 24 7s15 6.5 15 15.5Z"/><path d="m16 26 7-8 5 5 5-5"/></svg></div>
    <div class="eyebrow">A LITTLE PAUSE</div>
    <h1>Couldn’t reach Instagram</h1>
    <p id="description">Check your connection, then try again.<br>Your inbox is just a moment away.</p>
    <div class="actions"><button id="retry" type="button">Try again <span aria-hidden="true">↗</span></button><button id="inbox" class="secondary" type="button">Return to inbox</button></div>
  </main>
  <footer>Less scrolling. More conversation.</footer>
</body>
</html>
